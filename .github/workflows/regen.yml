name: Regenerate from upstream

# Moves both submodule pins to upstream main, regenerates generated/, builds, runs the tests, and
# opens (or updates) one "chore(regen): ..." pull request through the wmoop-bot GitHub App. Runs
# when wmoop.doc or wmoop.tools reports a green main, daily as a safety net, and by hand.
on:
  repository_dispatch:
    types: [wmoop-upstream-updated]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer run moves the pins further anyway, so it replaces an older one.
concurrency:
  group: regen
  cancel-in-progress: true

jobs:
  regen:
    uses: WMOOP/wmoop.tools/.github/workflows/binding.yml@main
    with:
      lang: csharp
      mode: regen
      dotnet: true
      build: >-
        dotnet build generated/Wmoop.Generated.sln --configuration Release --nologo &&
        dotnet build Wmoop.Net/Wmoop.Net.sln --configuration Release --nologo
      test: >-
        dotnet run --project Wmoop.Net/test/Wmoop.Tests --configuration Release --no-build &&
        dotnet run --project Wmoop.Net/src/Wmoop.Patterns.Demo --configuration Release --no-build
    secrets:
      app-id: ${{ secrets.WMOOP_BOT_APP_ID }}
      app-private-key: ${{ secrets.WMOOP_BOT_PRIVATE_KEY }}
