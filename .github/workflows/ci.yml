name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One shared pipeline for every binding (wmoop.tools/.github/workflows/binding.yml): the submodule
# pins are on upstream main, generated/ matches them exactly, then build and tests.
jobs:
  binding:
    uses: WMOOP/wmoop.tools/.github/workflows/binding.yml@main
    with:
      lang: csharp
      dotnet: true
      build: >-
        dotnet build generated/Wmoop.Generated.sln --configuration Release --nologo &&
        dotnet build Wmoop.Net/Wmoop.Net.sln --configuration Release --nologo
      test: >-
        dotnet run --project Wmoop.Net/test/Wmoop.Tests --configuration Release --no-build &&
        dotnet run --project Wmoop.Net/src/Wmoop.Patterns.Demo --configuration Release --no-build
